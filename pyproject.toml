[project]
name = "fpa-rolling-forecast"
version = "0.1.0"
description = "Rolling forecasts of SaaS P&L lines with automated variance flagging - an end-to-end FP&A analytics portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=16",
    "pandera>=0.20",
    "statsforecast>=2.0",
    "mlforecast>=0.15",
    "lightgbm>=4.5",
    "utilsforecast>=0.2",
    "plotly>=5.24",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["claims: headline results quoted in the README (checked on push, not in the monthly job)"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
